<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... | Marz Technology</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  .post-container{max-width:800px;margin:0 auto;padding:40px 20px;}
  .post-header{text-align:center;margin-bottom:40px;}
  .post-header h1{font-size:2.2rem;color:var(--navy);margin-bottom:16px;line-height:1.3;}
  .post-meta{color:#666;font-size:0.9rem;margin-bottom:16px;}
  .post-meta span{margin:0 12px;}
  .post-category{display:inline-block;background:var(--gold);color:var(--navy);padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;}
  .post-content{font-size:1.1rem;line-height:1.8;color:#333;}
  .post-content h2{font-size:1.5rem;color:var(--navy);margin:32px 0 16px;}
  .post-content h3{font-size:1.2rem;color:var(--navy);margin:24px 0 12px;}
  .post-content p{margin-bottom:16px;}
  .post-content ul,.post-content ol{margin:16px 0;padding-left:24px;}
  .post-content li{margin-bottom:8px;}
  .post-content blockquote{border-left:4px solid var(--gold);padding:16px 24px;margin:24px 0;background:#f9f9f9;font-style:italic;}
  .post-tags{margin-top:32px;padding-top:16px;border-top:1px solid #eee;}
  .post-tags .tag{display:inline-block;background:#e8f4f8;color:var(--navy);padding:4px 12px;border-radius:16px;font-size:0.8rem;margin:4px;}
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--navy);text-decoration:none;font-weight:500;margin-bottom:24px;}
  .back-link:hover{color:var(--gold);}
</style>
</head>
<body>
<header class="header">
  <div class="container">
    <a href="../index.html" class="logo"><img src="../images/logo-marz.png" alt="Marz Technology"></a>
    <button class="menu-toggle" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="../about.html" class="nav-link">About</a></li>
        <li><a href="../services.html" class="nav-link">Services</a></li>
        <li><a href="../ai-solutions.html" class="nav-link">AI Solutions</a></li>
        <li><a href="../products.html" class="nav-link">Products</a></li>
        <li><a href="../blog.html" class="nav-link active">Blog</a></li>
        <li><a href="../contact.html" class="nav-link">Contact</a></li>
      </ul>
    </nav>
    <a href="../contact.html" class="btn btn-primary">Get a Quote</a>
  </div>
</header>

<main>
  <div class="post-container">
    <a href="../blog.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Blog</a>
    <div id="postContent">
      <div style="text-align:center;padding:60px 0;"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--gold);"></i><p>Loading article...</p></div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom"><p>&copy; 2026 Marz Technology & Trading. All rights reserved.</p></div>
  </div>
</footer>

<script src="../js/script.js"></script>
<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (!slug) { document.getElementById('postContent').innerHTML='<h2>Article not found</h2><p>No slug specified.</p>'; return; }
  
  try {
    const res = await fetch('/api/posts?status=published&limit=50');
    const posts = await res.json();
    const post = posts.find(p => p.slug === slug);
    
    if (!post) { document.getElementById('postContent').innerHTML='<h2>Article not found</h2><p>This article does not exist or has been removed.</p>'; return; }
    
    document.title = post.title + ' | Marz Technology';
    
    let html = '<article class="post-article">';
    html += '<div class="post-header">';
    if (post.category) html += '<span class="post-category">'+post.category+'</span>';
    html += '<h1>'+post.title+'</h1>';
    html += '<div class="post-meta">';
    html += '<span><i class="fas fa-user"></i> '+(post.author||'Marz Technology')+'</span>';
    if (post.published_at) html += '<span><i class="fas fa-calendar"></i> '+new Date(post.published_at).toLocaleDateString('en-MY',{day:'numeric',month:'long',year:'numeric'})+'</span>';
    html += '</div></div>';
    
    if (post.content_html) {
      html += '<div class="post-content">'+post.content_html+'</div>';
    } else if (post.content) {
      html += '<div class="post-content"><p>'+post.content+'</p></div>';
    } else {
      html += '<div class="post-content"><p>'+post.excerpt+'</p></div>';
    }
    
    if (post.tags?.length) {
      html += '<div class="post-tags"><strong>Tags:</strong> '+post.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>';
    }
    
    html += '</article>';
    document.getElementById('postContent').innerHTML = html;
  } catch(err) {
    document.getElementById('postContent').innerHTML='<h2>Error loading article</h2><p>Please try again later.</p>';
  }
}
loadPost();
</script>
</body>
</html>
